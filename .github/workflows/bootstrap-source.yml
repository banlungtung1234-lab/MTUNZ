name: Bootstrap MTUNZ source into repository

on:
  push:
    branches: [main]
    paths:
      - source-bundle.parts/**

permissions:
  contents: write
  actions: write

jobs:
  extract-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble, verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s source-bundle.parts/00.b64
          test -s source-bundle.parts/21.b64
          test -s source-bundle.parts/22-tail.txt
          : > mtunz-source-bundle.tar.gz
          for n in $(seq -w 0 21); do
            cat "source-bundle.parts/${n}.b64" >> mtunz-source-bundle.tar.gz
          done
          base64 --decode source-bundle.parts/22-tail.txt >> mtunz-source-bundle.tar.gz
          echo "84de0519a221234c66d6e66d1b7856babe6fec8ae64ec39b04b0f9ca2788b147  mtunz-source-bundle.tar.gz" | sha256sum --check
          tar -tzf mtunz-source-bundle.tar.gz >/dev/null
          tar -xzf mtunz-source-bundle.tar.gz -C .
          rm -rf mtunz-source-bundle.tar.gz source-bundle.parts
          test -f app/pubspec.yaml
          test -f server/main.go
          test -f .github/workflows/build-native.yml
          test -f scripts/prepare-flutter-project.sh

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches the repository."
          else
            git commit -m "Add MTUNZ native Windows and Android source"
            git push origin HEAD:main
          fi

      - name: Dispatch native build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/banlungtung1234-lab/MTUNZ/actions/workflows/build-native.yml/dispatches -f ref=main
