name: Build MTUNZ native apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate native project and apply Android permissions
        shell: bash
        run: ../scripts/prepare-flutter-project.sh
        working-directory: app
      - name: Analyze Dart code
        run: flutter analyze
        working-directory: app
      - name: Run tests
        run: flutter test
        working-directory: app
      - name: Build APK
        run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: MTUNZ-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate native runner and apply platform bridges
        shell: bash
        run: ../scripts/prepare-flutter-project.sh
        working-directory: app
      - name: Analyze Dart code
        run: flutter analyze
        working-directory: app
      - name: Run tests
        run: flutter test
        working-directory: app
      - name: Build Windows release
        run: flutter build windows --release
        working-directory: app
      - name: Package Windows folder
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath MTUNZ-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MTUNZ-Windows-x64
          path: MTUNZ-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  signaling-server:
    name: Build Windows signaling server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test and vet signaling server
        run: |
          go test -race ./...
          go vet ./...
        working-directory: server
      - name: Cross-compile Windows signaling server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o MTUNZ-Signaling-Windows.exe .
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: MTUNZ-Signaling-Windows
          path: server/MTUNZ-Signaling-Windows.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish MTUNZ release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, signaling-server]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MTUNZ-Android-APK
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: MTUNZ-Windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: MTUNZ-Signaling-Windows
          path: release-assets/server
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
